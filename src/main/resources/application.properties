spring.application.name=demo

spring.config.import=optional:file:.env[.properties]

# Database Connection Details
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=900000

# Rate limiting (brute-force protection) for /api/auth/** endpoints.
# Shared per-IP quota across login + register.
rate-limit.auth.max-requests=5
rate-limit.auth.window-ms=60000
# Only set to true once a reverse proxy/load balancer sits in front of this app AND
# that proxy strips/overwrites any client-supplied X-Forwarded-For with its own value.
rate-limit.trust-forwarded-header=false
rate-limit.cleanup-interval-ms=300000

# Internationalization (i18n): locale is driven by the Accept-Language request header.
# Supported bundles: messages.properties (English, default/fallback), messages_si.properties (Sinhala).
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=en
spring.web.locale-resolver=accept-header