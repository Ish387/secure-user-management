# Bean Validation messages
validation.name.required=නම අවශ්‍යයි
validation.email.required=විද්‍යුත් තැපෑල අවශ්‍යයි
validation.email.invalid=වලංගු විද්‍යුත් තැපෑලක් විය යුතුය
validation.password.required=මුරපදය අවශ්‍යයි

# Noun translation table
entity.user=පරිශීලකයා
field.id=හැඳුනුම්පත
field.email=විද්‍යුත් තැපෑල
field.name=නම
field.password=මුරපදය

# Resource exception templates ({0}=entity noun, {1}=field noun, {2}=raw field value)
error.resource.not-found={1}: ''{2}'' සහිත {0} හමු නොවීය
error.resource.already-exists={1}: ''{2}'' සහිත {0} දැනටමත් පවතී

# Auth / security
error.auth.bad-credentials=වලංගු නොවන විද්‍යුත් තැපෑල හෝ මුරපදය
error.unauthorized=අනවසර ප්‍රවේශයකි

# Rate limiting
error.rate-limit.exceeded=ඉල්ලීම් ඉතා වැඩිය. කරුණාකර පසුව නැවත උත්සාහ කරන්න.

# Generic fallback
error.generic=අනපේක්ෂිත දෝෂයක් සිදු විය
