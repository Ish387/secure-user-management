# Bean Validation messages (referenced from DTO annotations via {code})
validation.name.required=Name is required
validation.email.required=Email is required
validation.email.invalid=Email must be valid
validation.password.required=Password is required

# Noun translation table: lowercase(word) -> localized noun, with English fallback
entity.user=User
field.id=id
field.email=email
field.name=name
field.password=password

# Resource exception templates ({0}=entity noun, {1}=field noun, {2}=raw field value)
error.resource.not-found={0} not found with {1}: ''{2}''
error.resource.already-exists={0} already exists with {1}: ''{2}''

# Auth / security
error.auth.bad-credentials=Invalid email or password
error.unauthorized=Unauthorized

# Rate limiting
error.rate-limit.exceeded=Too many requests. Please try again later.

# Generic fallback
error.generic=An unexpected error occurred
